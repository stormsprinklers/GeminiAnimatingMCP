# Copy this file to config.toml after cloning the project.
# Replace the paths with the absolute locations on your computer.
[mcp_servers.mascot_animations]
command = 'C:\Program Files\nodejs\node.exe'
args = ['C:\absolute\path\to\Gemini MCP\dist\mcp.js']
cwd = 'C:\absolute\path\to\Gemini MCP'
startup_timeout_sec = 20
tool_timeout_sec = 300
default_tools_approval_mode = 'writes'
enabled = true
